<!doctype html><html><body>
<button role="switch" data-state="off">Deep Thinking</button>
<button data-tool-trigger>Tool</button>
<div data-tool-menu style="display:none">
  <div><li class="t-dropdown__item" data-tool="search"><span><span>Search</span></span></li></div>
  <div><li class="t-dropdown__item" data-tool="writing"><span>Writing</span></li></div>
  <div><li class="t-dropdown__item" data-tool="solve"><span>Solve</span></li></div>
</div>
<script>
document.querySelector('[role=switch]').addEventListener('click', (event) => {
  const button = event.currentTarget;
  button.dataset.state = button.dataset.state === 'on' ? 'off' : 'on';
});
document.querySelector('[data-tool-trigger]').addEventListener('click', () => {
  document.querySelector('[data-tool-menu]').style.display = 'block';
});
document.querySelector('[data-tool="search"]').addEventListener('click', () => {
	  const selected = document.createElement('span');
	  selected.dataset.applicationId = 'application_id_web_search';
	  selected.dataset.value = 'Search';
	  selected.textContent = 'Search ×';
	  document.body.appendChild(selected);
  document.querySelector('[data-tool-menu]').style.display = 'none';
});
</script>
</body></html>
